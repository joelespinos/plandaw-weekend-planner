<div class="font-poppins mt-10 ml-10">
    <h2 class="font-semibold text-3xl text-[#236D4B]">Amistats</h2>
    <p class="mt-3">Afegeix a tota la teva colla amb el rol que més s'adeqüi a cadascú!</p>
</div>

<div class="">
    <input type="text" [(ngModel)]="friendName" placeholder="Nom del teu amic o amiga..." class="">
    <input type="text" [(ngModel)]="friendRole" placeholder="Rol del teu amic o amiga..." class="">
    <button (click)="addNewFriend()">Afegir nova amistat</button>
</div>

@if (friendsList().length > 0) {
    <div class="w-full flex flex-wrap justify-center items-center gap-x-12 gap-y-10 my-8 font-poppins">
        @for (friend of friendsList(); track friend.id) {
            <div class="w-[200px] flex justify-evenly items-center gap-x-4 border-2 border-gray-100 shadow-md p-4 rounded-md">
                <img src="images/default_user_icon.png" alt="Icona d'usuari per defecte" class="w-[60px]">
                <div class="">
                    <p class="text-lg"><strong>{{ friend.name }}</strong></p>
                    <p class="text-sm text-gray-500">{{ friend.role }}</p>
                </div>
            </div>
        }
    </div>
} @else {
    <div class="flex justify-center items-center">
        <div class="flex gap-x-2 w-fit mt-20 bg-blue-200 text-blue-600 border-2 px-5 py-2 rounded">
            <fa-icon [icon]="infoIcon()"></fa-icon>
            <p>No tens amistats afegides!</p>
        </div>
    </div>
}
