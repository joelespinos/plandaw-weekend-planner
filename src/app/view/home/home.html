<div class="font-poppins mt-10 ml-10">
    <h2 class="font-semibold text-3xl text-[#236D4B]">Benvingut a PlanDAW!</h2>
    <p class="mt-3">Cada quedada es converteix en una experiència per recordar</p>
</div>

<section class="flex flex-wrap justify-center items-center gap-x-15 gap-y-10 my-5 font-poppins [&>article]:border-gray-100 [&>article]:border-2 [&>article]:rounded-md [&>article]:shadow-md">
    <article class="flex flex-col gap-y-2.5 px-5 py-3">
        <h3 class="text-center text-xl font-semibold text-[#236D4B]">Catàleg d'idees</h3>
        <p>Descobreix plans per a tots els gustos i moments</p>
        <img class="w-[400px] h-[200px] object-cover rounded-md" src="/images/ideas-camping.webp" alt="Portada d'idees">
        <button [routerLink]="'/ideas'" class="bg-[#236D4B] text-[#E9F8E1] rounded py-2 mt-2 hover:bg-[#1d5f41] hover:cursor-pointer">Anar al catàleg d'idees</button>
    </article>

    <article class="flex flex-col gap-y-2.5 px-5 py-3">
        <h3 class="text-center text-xl font-semibold text-[#236D4B]">Caps de setmana únics</h3>
        <p>Genera el teu cap de setmana ideal en un clic</p>
        <img class="w-[400px] h-[200px] object-cover rounded-md" src="/images/weekend-cover.jpg" alt="Portada de caps de setmana">
        <button [routerLink]="'/weekend'" class="bg-[#236D4B] text-[#E9F8E1] rounded py-2 mt-2 hover:bg-[#1d5f41] hover:cursor-pointer">Generar caps de setmana</button>
    </article>

    <article class="flex flex-col gap-y-2.5 px-5 py-3">
        <h3 class="text-center text-xl font-semibold text-[#236D4B]">La teva colla reunida</h3>
        <p>Afegeix als teus amics i organitza plans junts</p>
        <img class="w-[400px] h-[200px] object-cover rounded-md" src="/images/friends-cover.jpg" alt="Portada d'amics">
        <button [routerLink]="'/friends'" class="bg-[#236D4B] text-[#E9F8E1] rounded py-2 mt-2 hover:bg-[#1d5f41] hover:cursor-pointer">Començar a afegir amics</button>
    </article>
</section>
